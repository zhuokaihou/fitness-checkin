services:
  app:
    environment:
      PUBLIC_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      SECURE_COOKIE: "true"
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
